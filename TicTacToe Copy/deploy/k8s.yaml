apiVersion: v1
kind: ConfigMap
metadata:
  name: tic-tac-toe-runtime
data:
  OPENAI_MODEL: gpt-5-mini
  LIGHT_SPEED_MCP_URL: http://127.0.0.1:8500/mcp
  LIGHT_SPEED_MCP_TRANSPORT: streamable_http
  LIGHT_SPEED_MCP_TIMEOUT_SECONDS: "10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tic-tac-toe-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tic-tac-toe-backend
  template:
    metadata:
      labels:
        app: tic-tac-toe-backend
    spec:
      containers:
        - name: backend
          image: tic-tac-toe-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8500
          envFrom:
            - configMapRef:
                name: tic-tac-toe-runtime
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tic-tac-toe-secrets
                  key: OPENAI_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /docs
              port: 8500
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8500
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: tic-tac-toe-backend
  ports:
    - port: 8500
      targetPort: 8500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tic-tac-toe-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tic-tac-toe-frontend
  template:
    metadata:
      labels:
        app: tic-tac-toe-frontend
    spec:
      containers:
        - name: frontend
          image: tic-tac-toe-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tic-tac-toe-frontend
spec:
  type: NodePort
  selector:
    app: tic-tac-toe-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
