[project]
name = "tic-tac-toe-backend"
version = "0.1.0"
description = "Canonical FastAPI game API with a constrained Light Speed MCP adapter."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.2",
    "fastmcp-slim[server] @ git+https://github.com/Lead-Orchestra/lightinig-mcp-sync.git@526135e6#subdirectory=fastmcp_slim",
    "openai-agents>=0.6.0",
    "pydantic-settings>=2.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = ["E741"]
