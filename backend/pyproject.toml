[project]
name = "openhands-tic-tac-toe-backend"
version = "0.1.0"
description = "FastAPI backend for the OpenHands tic-tac-toe take-home"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.128,<0.129",
    "starlette>=0.40,<0.51",
    "uvicorn[standard]>=0.40,<0.41",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.11,<0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
